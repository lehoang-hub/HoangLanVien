{% extends 'base.html' %}

{% block title %}Đăng Nhập - Mộc Nhiên Farmstay{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="card" style="padding: 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="logo" style="justify-content: center; margin-bottom: 8px;">
                <i class="fa-solid fa-tree"></i>
                <span>Mộc Nhiên Farmstay</span>
            </div>
            <h2 style="font-size: 22px; color: var(--primary);">Đăng Nhập Tài Khoản</h2>
        </div>

        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 16px;">
                <label style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px;">Tên đăng nhập</label>
                <input type="text" name="username" required class="form-control" style="width: 100%;" placeholder="Nhập tên tài khoản">
            </div>

            <div style="margin-bottom: 24px;">
                <label style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px;">Mật khẩu</label>
                <input type="password" name="password" required class="form-control" style="width: 100%;" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; height: 44px; font-size: 15px;">
                Đăng Nhập
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
            Chưa có tài khoản? <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 700;">Đăng ký ngay</a>
        </div>
    </div>
</div>
{% endblock %}
